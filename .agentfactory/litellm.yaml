model_list:
  - model_name: gpt-5.6-sol          # main/agentic model
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.6-terra        # optional mid lane for scoped tasks
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.6-luna         # background/haiku-class calls
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY

  # Aliases for the model ids the host asks for BY NAME. A session picks its main model from the
  # profile, but sub-agents and background calls request a CLASS, and any class key left unset falls
  # back to the host's own built-in claude-* id — which a gateway with a closed model_list refuses,
  # killing the spawn that asked for it. No ANTHROPIC_* key can redirect those, so only an alias
  # answers them; `af config models check` demands one per claude-* id this factory's direct
  # profiles name. Point the LARGE classes (opus/sonnet/fable) at the MAIN model (gpt-5.6-sol): the
  # host sizes their context window large by the claude- id it asked for, so aliasing them to a
  # smaller lane trades an unserved-model failure for an over-window one. The haiku class is the
  # exception — the host sizes a claude-haiku-4-5 request small, so it routes to the background lane
  # (gpt-5.6-luna), matching models.json. Ids are enumerated one per line — LiteLLM
  # wildcard routing is not relied on. Add a line here whenever you add a direct claude-* profile.
  - model_name: claude-opus-5
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-fable-5
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-opus-4-8
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true          # drop Anthropic-only params instead of 400ing

router_settings:
  num_retries: 2
  timeout: 300               # agentic turns can run long; don't use 30s

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
